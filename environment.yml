# conda env create -f environment.yml && conda activate recsa
# The environment every result of the paper was produced in (exported from it; CUDA 12.8 wheels of torch).
# flash-attn 2.8.3 builds against the installed torch; if pip cannot build it in this step, install the rest first
# and then: pip install flash-attn==2.8.3 --no-build-isolation
