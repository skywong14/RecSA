[pytest]
addopts = --strict-markers
markers =
    gpu: requires CUDA and Triton kernels
    slow: informational only (long-running); not deselected by any gate
    full: opt-in tier, run only by `scripts/run_tests.sh --full` -- non-default geometry (top-k 512, top-k-64-only kernels, NL=4, >1,048,576 tokens), the level-bias and forced-bucket code paths, benchmark-style large shapes
testpaths = tests
